  <path d="M331 630H402" class="flow" marker-start="url(#arrowBack)"/>

  <rect x="892" y="575" width="256" height="110" rx="16" fill="#e9eeec"/>
  <text x="914" y="607" class="label muted">DIAGRAM SCOPE</text>
  <text x="914" y="635" class="small muted">High-level capabilities only.</text>
  <text x="914" y="658" class="small muted">Private details omitted.</text>

  <line x1="52" y1="735" x2="1148" y2="735" stroke="#d6e1dc"/>
