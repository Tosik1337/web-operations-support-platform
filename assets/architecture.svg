  <path d="M997 452v17c0 10 46 10 46 0v-17" fill="#e0eee5" stroke="#679279" stroke-width="1.5"/>
  <text x="918" y="502" font-size="20" font-weight="650">Conversation storage</text>
  <text x="918" y="526" class="small muted">Messages and status</text>
  <path d="M796 486H886" class="flow" marker-start="url(#arrowBack)"/>
  <text x="810" y="471" font-size="13" class="muted">Context</text>

